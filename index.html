<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus AI</title><meta name="theme-color" content="#101116"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#eee;font:15px system-ui}button,input,textarea,select{font:inherit;color:inherit;background:#22252e;border:1px solid #393d48;border-radius:10px;padding:10px}button{cursor:pointer}button:disabled{opacity:.5}button.primary{background:#6655dc}#app{display:grid;grid-template-columns:260px 1fr;height:100dvh}aside{background:#181a21;padding:16px;overflow:auto}main{min-width:0;display:flex;flex-direction:column;overflow:auto}header,footer{padding:14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #30333d}header select{max-width:100%;flex:1;min-width:100px}#messages{flex:1;overflow:auto;padding:24px max(16px,calc((100% - 850px)/2));min-height:120px}.msg{white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0;padding:16px;border-radius:14px;background:#1d2028}.user{background:#30304a;margin-left:12%}.meta{font-size:12px;color:#aaa;margin-bottom:8px}footer{border-top:1px solid #30333d;border-bottom:0}footer textarea{flex:1;min-width:150px;resize:vertical}#history button{display:block;width:100%;text-align:left;margin:7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#status{padding:8px 14px;color:#bdb8ea;font-size:12px}#studio{padding:16px;flex:1;overflow:auto}#code{width:100%;height:35vh;font:13px monospace}iframe{background:white;width:100%;height:45vh;border:0;border-radius:8px}#menu{display:none}h2{letter-spacing:-1px}small{color:#aaa} [hidden]{display:none!important}@media(max-width:700px){#app{grid-template-columns:1fr}aside{display:none;position:fixed;inset:0 20% 0 0;z-index:10;box-shadow:0 0 0 100vw #0008}aside.open{display:block}#menu{display:inline-block}header{padding:9px}#messages{padding:12px}footer{padding:8px}}

button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a99aff;outline-offset:2px}#history button.selected{border-color:#a99aff;background:#35304d}footer{padding-bottom:max(12px,env(safe-area-inset-bottom))}.msg button{float:right;padding:4px 8px;font-size:12px}.msg pre{overflow:auto;background:#101116;padding:12px;border-radius:8px;white-space:pre-wrap}#studio textarea{resize:vertical}#status{min-height:30px}#close{display:none}@media(max-width:700px){#close{display:inline-block}header input{flex:1}header select{flex-basis:60%}textarea,input,select{font-size:16px}footer textarea{min-width:100%;max-height:25vh}footer button{flex:1}} 
</style><div id="app"><aside id="side"><h2>NEXUS / AI</h2><button id="close" >Fermer</button> <button id="new" class="primary">+ Chat</button><p id="account">Non connecté</p><button id="login">Connexion Google / Puter</button><button id="logout">Déconnexion</button><p><button id="sync">Synchroniser</button> <button id="backup">Exporter chats</button> <button id="import">Importer</button><input type="file" id="importFile" accept=".json,application/json" hidden></p><input id="findChat" placeholder="Rechercher un chat" style="width:100%"><div id="history"></div></aside><main><header><button id="menu">☰</button><input id="filter" placeholder="Filtrer modèles" style="width:130px"><select id="model"><option value="claude-sonnet-4-6">Claude Sonnet 4.6</option></select><button id="reload">↻</button><button id="mode">Studio web</button></header><div id="status">Connexion requise pour utiliser l’IA.</div><section id="messages"></section><section id="studio" hidden><h2>Studio de création web</h2><textarea id="code" placeholder="Code HTML, CSS et JavaScript autonome"></textarea><p><button id="preview">Aperçu</button> <button id="export">Exporter index.html</button> <button id="extract">Récupérer le dernier code IA</button></p><iframe id="frame" sandbox="allow-scripts" title="Aperçu isolé"></iframe></section><footer><textarea id="prompt" rows="3" placeholder="Écrivez votre message ou décrivez votre site…"></textarea><button id="send" class="primary">Envoyer</button><button id="delete">Supprimer chat</button><button id="rename">Renommer</button></footer></main></div><script>
const $=id=>document.getElementById(id), KEY='nexus-ai-v1';let owner=null, chats=[], current=null, models=[], busy=false, studio=false, queue=Promise.resolve();const status=s=>$('status').textContent=s;const err=e=>e?.message||e?.msg||String(e??'Erreur inconnue');const localKey=()=>KEY+':'+owner;const active=()=>chats.find(c=>c.id===current);function local(){if(owner)try{localStorage.setItem(localKey(),JSON.stringify(chats))}catch(e){status('Stockage local indisponible : '+err(e))}}function save(){local();if(!owner)return;const snapshot=JSON.stringify(chats), who=owner;queue=queue.catch(()=>{}).then(async()=>{if(owner!==who)return;const r=await puter.kv.get(KEY);if(owner!==who)return;const map=new Map();for(const c of [...(r?(typeof r==='string'?JSON.parse(r):r):[]),...JSON.parse(snapshot)])if(c?.id&&(!map.has(c.id)||c.updated>=map.get(c.id).updated))map.set(c.id,c);await puter.kv.set(KEY,JSON.stringify([...map.values()]))}).catch(e=>status('Sauvegarde cloud échouée : '+err(e)));}function merge(remote){const map=new Map();for(const c of [...chats,...remote])if(c&&c.id&&(!map.has(c.id)||c.updated>map.get(c.id).updated))map.set(c.id,c);chats=[...map.values()].sort((a,b)=>b.updated-a.updated)}async function sync(){if(!owner)return;await queue;const r=await puter.kv.get(KEY);if(r)merge(typeof r==='string'?JSON.parse(r):r);local();render();save();await queue;}
let sdkPromise=null;function ensurePuter(){if(window.puter?.auth&&window.puter?.ai)return Promise.resolve(window.puter);if(sdkPromise)return sdkPromise;status('Chargement de Puter.js…');sdkPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://js.puter.com/v2/';script.async=true;const timer=setTimeout(()=>fail(),20000);function fail(){clearTimeout(timer);script.remove();reject(Error('Puter.js inaccessible. Vérifiez Internet, désactivez le bloqueur pour js.puter.com, puis cliquez sur Recharger les modèles.'))}script.onerror=fail;script.onload=()=>{clearTimeout(timer);if(window.puter?.auth&&window.puter?.ai)resolve(window.puter);else fail()};document.head.append(script)}).catch(e=>{sdkPromise=null;throw e});return sdkPromise;}
function render(){const list=$('history');list.replaceChildren();for(const c of chats.filter(c=>!c.deleted&&c.title.toLowerCase().includes($('findChat').value.toLowerCase()))){const b=document.createElement('button');b.textContent=c.title;if(c.id===current)b.classList.add("selected");b.onclick=()=>{if(busy)return;current=c.id;$('code').value=c.code||'';$('frame').srcdoc='';if(c.model)$('model').value=c.model;$('side').classList.remove('open');render()};list.append(b)}const box=$('messages');box.replaceChildren();for(const m of active()?.messages||[]){const d=document.createElement('div');d.className='msg '+m.role;const label=document.createElement('div');label.className='meta';label.textContent=m.role==='user'?'Vous':m.model||'Assistant';const copy=document.createElement("button");copy.textContent="Copier";copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.content);copy.textContent="Copié"}catch(e){status(err(e))}};d.append(copy,label,document.createTextNode(m.content));box.append(d)}if(!active())box.textContent='Choisissez un modèle et commencez une conversation.';box.scrollTop=box.scrollHeight;}
function fresh(){if(busy)return;current=null;$('code').value='';$('frame').srcdoc='';$('side').classList.remove('open');render()}
async function session(){await ensurePuter();if(!puter.auth.isSignedIn())return;const u=await puter.auth.getUser();owner=u.uuid||u.id||u.username;if(!owner)throw Error('Identité indisponible');$('account').textContent=u.username||'Connecté';try{chats=JSON.parse(localStorage.getItem(localKey())||'[]')}catch{chats=[]}current=null;render();try{await sync()}catch(e){status('Historique local uniquement : '+err(e))} }
$('login').onclick=async()=>{if(busy)return;try{await ensurePuter();await puter.auth.signIn();await session();status('Connecté');await loadModels()}catch(e){status(err(e))}};$('logout').onclick=async()=>{if(busy)return;try{await ensurePuter();await queue;await puter.auth.signOut();owner=null;chats=[];current=null;$('account').textContent='Non connecté';$('code').value='';$('frame').srcdoc='';$('prompt').value='';render();status('Déconnecté')}catch(e){status(err(e))}};$('sync').onclick=()=>sync().catch(e=>status(err(e)));$('new').onclick=fresh;$('findChat').oninput=render;$('menu').onclick=()=>$('side').classList.add('open');$('close').onclick=()=>$('side').classList.remove('open');
function showModels(){const s=$('model'),old=s.value,q=$('filter').value.toLowerCase();s.replaceChildren();for(const m of models.filter(m=>JSON.stringify([m.id,m.name,m.provider]).toLowerCase().includes(q))){const o=document.createElement('option');o.value=m.puterId||m.id;o.textContent=(m.name||m.id)+' · '+(m.provider||'Puter');s.append(o)}if([...s.options].some(o=>o.value===old))s.value=old;}
async function loadModels(){try{await ensurePuter();const result=await puter.ai.listModels();models=Array.isArray(result)?result:(result.models||result.data||[]);models=models.map(m=>typeof m==='string'?{id:m,name:m,provider:'Puter'}:m).filter(m=>m.id||m.puterId);if(!models.length)throw Error("Catalogue vide");showModels();status(models.length+' modèles de chat référencés')}catch(e){status('Catalogue indisponible : '+err(e))}}$('filter').oninput=()=>{if(models.length)showModels()};$('reload').onclick=loadModels;
$('send').onclick=async()=>{const prompt=$('prompt').value.trim(),model=$('model').value;if(!prompt||busy||!model)return;if(!owner){status('Connectez-vous avant d’envoyer.');return}busy=true;$('send').disabled=true;let c=active();if(!c){c={id:crypto.randomUUID(),title:prompt.slice(0,65),messages:[],updated:Date.now()};chats.unshift(c);current=c.id}c.model=model;c.messages.push({role:'user',content:prompt});c.updated=Date.now();$('prompt').value='';save();render();const payload=c.messages.map(({role,content})=>({role,content}));if(studio)payload.unshift({role:'system',content:'Tu es un développeur web. Génère un fichier index.html autonome complet compatible GitHub Pages dans un bloc ```html. Pour modifier un site, conserve ses fonctionnalités.'});if(studio&&$('code').value)payload.push({role:'user',content:'Code actuel à modifier selon ma demande :\n'+$('code').value});const a={role:'assistant',content:'',model};try{status('Génération en cours…');const response=await puter.ai.chat(payload,{model,stream:true});c.messages.push(a);for await(const part of response){if(part?.text){a.content+=part.text;render()}}if(!a.content)throw Error('Réponse vide');status('Réponse terminée');if(studio){extract();c.code=$('code').value}}catch(e){if(!a.content)c.messages=c.messages.filter(m=>m!==a);status('Erreur IA : '+err(e))}finally{c.updated=Date.now();save();busy=false;$('send').disabled=false;render()}};
$('delete').onclick=()=>{if(busy||!active()||!confirm('Supprimer cette conversation ?'))return;Object.assign(active(),{deleted:true,messages:[],updated:Date.now()});current=null;save();render()};function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('backup').onclick=()=>download('nexus-chats.json',JSON.stringify(chats.filter(c=>!c.deleted),null,2),'application/json');$('mode').onclick=()=>{studio=!studio;$('studio').hidden=!studio;$('messages').hidden=studio;$('mode').textContent=studio?'Chat':'Studio web'};function extract(){const m=active()?.messages.filter(m=>m.role==='assistant').at(-1);const code=m?.content.match(/```html\s*([\s\S]*?)```/i)?.[1]||m?.content.match(/<!doctype html>[\s\S]*<\/html>/i)?.[0];if(code){$('code').value=code;$('frame').srcdoc=code}else status('Aucun bloc HTML complet trouvé.')} $('rename').onclick=()=>{if(busy||!active())return;const t=window.prompt('Nom de la conversation',active().title);if(t?.trim()){active().title=t.trim().slice(0,120);active().updated=Date.now();save();render()}};
$('import').onclick=()=>{if(owner&&!busy)$('importFile').click();else status('Connectez-vous pour importer.')};$('importFile').onchange=async()=>{try{const f=$('importFile').files[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(c=>typeof c.id==='string'&&typeof c.title==='string'&&Number.isFinite(c.updated)&&Array.isArray(c.messages)&&c.messages.every(m=>['user','assistant'].includes(m.role)&&typeof m.content==='string')))throw Error('Format de sauvegarde invalide');merge(data);save();render();status('Historique importé')}catch(e){status(err(e))}finally{$('importFile').value=''}};
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('send').click()}});window.addEventListener('focus',()=>{if(owner&&!busy)sync().catch(e=>status(err(e)))});$('extract').onclick=extract;$('preview').onclick=()=>{$('frame').srcdoc=$('code').value;if(active()&&!busy){active().code=$('code').value;active().updated=Date.now();save()}};$('export').onclick=()=>download('index.html',$('code').value,'text/html');render();(async()=>{try{await ensurePuter();await session();await loadModels()}catch(e){status(err(e))}})();
</script></html>
